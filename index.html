<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quiz RPG - The Hero's Destiny</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Un jeu de quiz immersif avec progression RPG. Installe l'app pour joueur hors ligne!" />
    <meta name="theme-color" content="#1f144c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quiz RPG" />
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Quiz RPG - The Hero's Destiny" />
    <meta property="og:description" content="Un jeu de quiz immersif avec progression RPG" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quiz-rpg.com" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        overflow: auto !important;
        transform: none !important;
        filter: none !important;
        opacity: 1 !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .app-header {
        background: linear-gradient(135deg, rgba(31, 20, 76, 0.98), rgba(15, 10, 31, 0.98));
        border-bottom: 2px solid #c9a961;
        padding: 16px 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .header-content {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-icon { font-size: 28px; }
      .app-header h1 {
        font-size: 22px;
        font-weight: 800;
        color: #c9a961;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .logo-subtitle {
        font-size: 11px;
        color: #7f9d8c;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-left: 10px;
      }
      @media (max-width: 640px) {
        .app-header {
          padding: 10px 12px;
          justify-content: flex-start;
        }
        .header-content {
          gap: 6px;
        }
        .logo-icon { font-size: 20px; }
        .app-header h1 {
          font-size: 14px;
          letter-spacing: 1px;
          white-space: nowrap;
        }
        .logo-subtitle {
          display: none;
        }
      }
      .app-footer {
        background: linear-gradient(135deg, rgba(31, 20, 76, 0.98), rgba(15, 10, 31, 0.98));
        border-top: 2px solid #c9a961;
        padding: 30px 20px 20px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
        color: #b8a8d8;
        margin-top: 60px;
      }
      .footer-content {
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: space-around;
        gap: 30px;
        flex-wrap: wrap;
      }
      .footer-section h3 {
        color: #c9a961;
        font-size: 14px;
        letter-spacing: 1px;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      .footer-section p, .footer-section li { font-size: 13px; color: #7f9d8c; }
      .footer-links { list-style: none; }
      .footer-links li { margin: 5px 0; }
      .footer-links a, .footer-section a {
        color: #7f9d8c;
        text-decoration: none;
        transition: color 0.2s;
      }
      .footer-links a:hover, .footer-section a:hover { color: #c9a961; }
      .footer-bottom {
        text-align: center;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid rgba(201, 169, 97, 0.2);
        font-size: 12px;
        color: #5a7a6f;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-content">
        <span class="logo-icon">🎮</span>
        <h1>Quiz RPG</h1>
        <span class="logo-subtitle">The Hero's Destiny</span>
      </div>
    </header>

    <div id="root"></div>
    
    <footer class="app-footer">
      <div class="footer-content">
        <div class="footer-section">
          <h3>Quiz RPG</h3>
          <p>Un jeu de quiz immersif avec progression RPG</p>
        </div>
        <div class="footer-section">
          <h3>Liens Rapides</h3>
          <ul class="footer-links">
            <li><a href="#" id="legal-mentions">Mentions Légales</a></li>
            <li><a href="#" id="legal-politique">Politique de Confidentialité</a></li>
            <li><a href="#" id="legal-cookies">Gestion des Cookies</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h3>Contact</h3>
          <p><a href="https://laetitiabraun.eu" target="_blank" rel="noopener noreferrer">laetitiabraun.eu</a></p>
          <p><a href="mailto:laetitiabraun2@gmail.com">laetitiabraun2@gmail.com</a></p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Quiz RPG — Créé par <a href="https://laetitiabraun.eu" target="_blank">Laetitia Braun</a></p>
      </div>
    </footer>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
