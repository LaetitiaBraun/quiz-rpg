<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0f0a1f" rx="20"/>
  
  <!-- Gamepad/Controller shape -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffd700" stroke-width="3"/>
  
  <!-- D-pad (left side) -->
  <rect x="25" y="42" width="8" height="16" fill="#1d9e75" rx="2"/>
  <rect x="19" y="48" width="16" height="8" fill="#1d9e75" rx="2"/>
  
  <!-- Buttons (right side) -->
  <circle cx="70" cy="42" r="4" fill="#ff6b6b"/>
  <circle cx="76" cy="48" r="4" fill="#ffd700"/>
  <circle cx="64" cy="48" r="4" fill="#5dcaa5"/>
  <circle cx="70" cy="54" r="4" fill="#7f77dd"/>
  
  <!-- Center bar -->
  <rect x="35" y="58" width="30" height="6" fill="#c9a961" rx="3"/>
  
  <!-- RPG text -->
  <text x="50" y="82" font-size="12" font-weight="bold" fill="#b8a8d8" text-anchor="middle">RPG</text>
</svg>
